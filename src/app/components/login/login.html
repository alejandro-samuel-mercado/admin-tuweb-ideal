<div class="min-h-screen bg-gray-900 flex items-center justify-center px-4">
  <div class="max-w-md w-full bg-gray-800 rounded-xl shadow-2xl p-8 border border-gray-700">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-white mb-2">Admin Panel</h1>
      <p class="text-gray-400">TuWebIdeal Administration</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-6">
      <div
        *ngIf="error"
        class="bg-red-500/10 border border-red-500/50 text-red-500 p-3 rounded-lg text-sm text-center"
      >
        {{ error }}
      </div>

      <div>
        <label class="block text-gray-300 text-sm font-medium mb-2">Email</label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:border-purple-500 transition-colors"
          placeholder="admin@tuwebideal.com"
          required
        />
      </div>

      <div>
        <label class="block text-gray-300 text-sm font-medium mb-2">Contraseña</label>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:border-purple-500 transition-colors"
          placeholder="••••••••"
          required
        />
      </div>

      <button
        type="submit"
        [disabled]="loading"
        class="w-full py-3 bg-purple-600 hover:bg-purple-500 text-white font-bold rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
      >
        {{ loading ? 'Iniciando...' : 'Entrar' }}
      </button>
    </form>
  </div>
</div>
